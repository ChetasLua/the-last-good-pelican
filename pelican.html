<script type="text/plain" id="exposure-sheet">
THE LAST GOOD PELICAN — director's exposure sheet
16:9; 960 × 540 design units; 3600 frames at 60/s. Poses at floor(t*12)/12; lens and layers continuous. No external resources.
A film about a creature who declines to count himself among the successes.

COLOUR SCRIPT
I. Carbon-blue sill, cold oyster feathers, a bruised plum dark; the one ember is the vermilion scarf.
II. Naples yellow, oat, green-grey surf, dusty violet cliff. The road is a pale ribbon, the shadows have air.
III. The bell takes the yellow out of the paper. Rough construction lines outlive the creature's arrival.
IV. The contact is a small patch of warm ivory against a muted, defocused green. The red changes owner.
V. Ash rose sky, smoked violet foreground and pewter sea. The gate keeps its colder local colour.

MODEL SHEET (screen right is forward; profile is not a generic gull)
Old bird: a heavy ivory head with a split windswept crest; bare grey-olive orbital patch like a river pebble.
Clove-coloured round iris with a double pinpoint of light; lowered fleshy upper lid, three separate brow feathers.
Long pale ochre upper mandible, a distinct darker hook/nail at its tip; deep hanging uninflated leather pouch.
S-curve neck, tucked massive chest, slate secondaries over warm ivory coverts; three expressive long finger-feathers.
Narrow vermilion neckerchief has two unequal tails. Dark satchel, pale stitched label 'astra 6.2'. Left pedal cracked leather.
Newborn: half his size, ash and unpainted paper, dark little eye, a pencilled angular fold in the neck;
one unclosed contour stays visible after the fall. Never straighten its neck, even after the touch.
The circler has an eccentric square rim and a patient outward gaze; the carrier has both a spare beak and a precious bicycle.
Gate is a sea-green measuring stick and a big mechanical chronometer, not a villain with a face.
Visual rhyme: bell clapper / eyelid; bicycle hub / stopwatch pivot; outstretched feather / second hand.

SHOT LIST — 18 shots (cut at right hand edge of each interval)
01  0.00 -  2.25  Bell above a sleeping harbour; one small shutter catches the light, establish who wakes whom.
02  2.25 -  6.00  Eye extreme CU and rolling throat, hold past the exhale rather than cutting on the blink.
03  6.00 -  8.80  Shed interior medium; hands on bars, wheels eased out of their chalk marks.
04  8.80 - 11.70  Insert studies under pins: a wing holds up a crossed-out corner, leaves it swinging.
05 11.70 - 14.00  At the threshold, bike and bird overlap, then part from their workshop shadow.
06 14.00 - 18.65  Long sunlit coast, a small rider below great headlands. Patient lateral drift; find the circler.
07 18.65 - 21.35  Very low track along the wheels; axle, ratchet, chain, gravel, a square wheel struggling beyond.
08 21.35 - 26.00  Medium two-plane pass of the carrier. His eyes go to the other bird before his head, away, back.
09a 26.00 - 26.98  Commissioning insert (added in the final edit): the cold bell physically indexes the press; a new test leaves its rollers.
09b 26.98 - 29.45  Match the moving paper back to the road. Light drains; a blue line and an unresolved hooked neck draw themselves into air.
10 29.45 - 32.30  Newborn buckles/lands. Rider brakes, weight still goes forward. No score to tell us what to think.
